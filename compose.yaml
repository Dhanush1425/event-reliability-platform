services:
  postgres:
    image: postgres:17
    container_name: event-platform-db
    environment:
      POSTGRES_DB: event_platform
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_user -d event_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
