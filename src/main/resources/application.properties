
spring.application.name=event-reliability-platform

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/event_platform}
spring.datasource.username=${DB_USERNAME:event_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# Circuit Breaker configuration
resilience4j.circuitbreaker.instances.webhookDelivery.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.webhookDelivery.sliding-window-size=5
resilience4j.circuitbreaker.instances.webhookDelivery.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.webhookDelivery.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.webhookDelivery.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.webhookDelivery.permitted-number-of-calls-in-half-open-state=2

logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.io.github.resilience4j=INFO

#actuator
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true

resilience4j.circuitbreaker.instances.webhookDelivery.register-health-indicator=true
